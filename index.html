<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Localiza CCT - UDESC</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <div class="logo-circle">CCT</div>
      <div class="header-title">
        <h1>Localiza CCT</h1>
        <p>UDESC - Joinville</p>
      </div>
    </div>
    <button class="header-btn" title="Menu" aria-label="Abrir menu">Menu</button>
  </header>

  <section class="search-bar">
    <div class="search-input-wrap">
      <span aria-hidden="true">Busca</span>
      <input type="text" placeholder="Buscar bloco, sala ou servico..." id="searchInput" autocomplete="off">
    </div>
  </section>

  <main class="map-wrap" id="mapWrap">
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomIn" aria-label="Aproximar">+</button>
      <button class="zoom-btn" id="zoomOut" aria-label="Afastar">-</button>
    </div>

    <div class="overlay-dim" id="overlayDim"></div>

    <section class="info-panel" id="infoPanel">
      <div class="panel-handle"></div>
      <button class="panel-close" id="panelClose" aria-label="Fechar painel">x</button>
      <div class="panel-tag" id="panelTag">Bloco</div>
      <div class="panel-name" id="panelName">-</div>
      <div class="panel-desc" id="panelDesc">-</div>
      <button class="panel-btn">Traçar rota até aqui</button>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navegacao principal">
    <button class="nav-item active">
      <span class="icon">Mapa</span>
      <span class="label">Mapa</span>
    </button>
    <button class="nav-item">
      <span class="icon">Rota</span>
      <span class="label">Rotas</span>
    </button>
    <button class="nav-item">
      <span class="icon">CCT</span>
      <span class="label">Blocos</span>
    </button>
    <button class="nav-item">
      <span class="icon">CFG</span>
      <span class="label">Config</span>
    </button>
  </nav>

  <script src="js/main.js"></script>
</body>
</html>
