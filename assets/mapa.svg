    <polygon points="646,604 724,567 757,584 680,622" fill="url(#parkingLines)" opacity=".65"/>
  </g>

  <text x="92" y="662" class="street-label" transform="rotate(38 92 662)">JOINVILLE GARTEN SHOPPING</text>
  <text x="813" y="510" class="street-label" transform="rotate(104 813 510)">UNIVILLE</text>

