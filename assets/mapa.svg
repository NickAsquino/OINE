<?xml version="1.0" encoding="utf-8"?>
<svg id="map-svg" xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-label="Mapa do campus UDESC Joinville">
  <defs>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9AFB96"/>
      <stop offset="1" stop-color="#7CEC86"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D5250"/>
      <stop offset="1" stop-color="#2F3432"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#204528" flood-opacity="0.22"/>
    </filter>
    <filter id="pinShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#092310" flood-opacity="0.35"/>
    </filter>
    <pattern id="parkingLines" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(20)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#E6ECE7" stroke-width="2" opacity="0.8"/>
    </pattern>
    <symbol id="tree" viewBox="-16 -20 32 34">
      <rect x="-2" y="2" width="4" height="12" rx="1" fill="#71552D"/>
      <circle cx="-5" cy="-4" r="8" fill="#2FAE47"/>
      <circle cx="4" cy="-7" r="9" fill="#3CCB55"/>
      <circle cx="0" cy="-13" r="7" fill="#64DF60"/>
      <circle cx="8" cy="-1" r="6" fill="#238E3C"/>
    </symbol>
    <style>
      .campus-label { font-family: "Segoe UI", Arial, sans-serif; font-weight: 800; letter-spacing: .04em; fill: #07170A; }
      .street-label { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #4F8D56; letter-spacing: .06em; opacity: .8; }
      .building { cursor: pointer; transition: opacity .18s ease, transform .18s ease; transform-box: fill-box; transform-origin: center; }
      .building:hover { transform: translateY(-4px); }
      .roof { fill: #DDE3E4; }
      .wall-a { fill: #AEB9BA; }
      .wall-b { fill: #87989B; }
      .accent { fill: #1598E8; }
      .accent-dark { fill: #0062A8; }
      .roof-red { fill: #EF6B72; }
      .roof-green { fill: #40BD59; }
      .roof-orange { fill: #F28A25; }
      .block-letter { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 900; text-anchor: middle; fill: #3A4647; }
      .block-letter.light { fill: #FFFFFF; }
      .pin-head { fill: #08260F; }
      .pin-text { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 900; text-anchor: middle; fill: #FFFFFF; }
      .pin-stem { stroke: #08260F; stroke-width: 4; stroke-linecap: round; }
      .legend { font-family: "Segoe UI", Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #07170A; }
    </style>
  </defs>

  <rect width="900" height="900" fill="url(#grassGrad)"/>

